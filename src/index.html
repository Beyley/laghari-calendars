<!DOCTYPE html>
<html>
  <head>
    <title>Laghari Portals Calendars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="lato.css">
    <link rel="stylesheet" href="index.css">
    <script type="text/javascript" src="index.js">
    </script>
  </head>
  <body>
    <header>
      <div>
        <p>
          <span id="calendar-title" class="title">
            ranyar2
          </span>
          <span class="slider-container">
            <span class="slider-label lato-light">Scale:</span>
            <input type="range" min="0.1" max="2" value="1" step="0.01" class="slider" id="scale_slider">
          </span>
          <span class="slider-container">
            <span class="slider-label lato-light">Max Columns:</span>
            <input type="range" min="1" max="30" value="18" class="slider" id="max_width_slider">
          </span>
          <span class="slider-container">
            <span class="slider-label lato-light">Language:</span>
            <span class="dropdown">
              <button class="dropbtn lato-light" id="language-dropdown-button">Dropdown</button>
              <span class="dropdown-content">
                <a href="#" onclick="set_language(Language.english)" class="lato-light">English</a>
                <a href="#" onclick="set_language(Language.solar)" class="solar solar-font">t2hp2r2 nya</a>
                <a href="#" onclick="set_language(Language.martian)" class="martian martian-font">t2hp2r2 naq</a>
                <a href="#" onclick="set_language(Language.neptunian)" class="neptunian neptunian-font">SHPRE YHG</a>
              </span>
            </span>
          </span>
        </p>
      </div>
    </header>
    <div id="calendar-table" class="calendar-table">
    </div>
  </body>
</html>
